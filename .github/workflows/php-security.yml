name: PHP security checks

on:
  push:
    branches: [main, "security/**"]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli

      - name: Lint PHP files
        run: |
          set -e
          find . -type f -name "*.php" -not -path "./.git/*" -print0 |
            xargs -0 -n1 php -l
